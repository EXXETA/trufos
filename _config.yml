# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing these this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.github_repo }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
theme: just-the-docs
title: Trufos
description: A free, open source REST Client Application with VCS support.
url: "https://exxeta.github.io"
baseurl: "/trufos"

favicon_ico: "/assets/favicon.ico"
lang: en

# Used by _includes/footer_custom.html and documentation/index.md.
discord_url: &discord_url "https://discord.gg/sb4nfdevpW"

# Header links (just-the-docs). The GitHub icon in _includes/header_custom.html sits next to them.
aux_links:
  "Discord": *discord_url
  "Releases": "https://github.com/EXXETA/trufos/releases"
aux_links_new_tab: true

# "Edit this page on GitHub" in the page footer. Pages copied from the app repository
# (CONTRIBUTING.md, CODE_OF_CONDUCT.md, ported architecture docs) must be changed on `main` first.
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/EXXETA/trufos"
gh_edit_branch: "gh-pages"
gh_edit_view_mode: "edit"

# SEO and Open Graph (jekyll-seo-tag, included by the theme). The default image is set in `defaults` below.
logo: "/assets/images/icon-256.png"
social:
  name: Trufos
  links:
    - "https://github.com/EXXETA/trufos"
    - *discord_url

# Custom colour schemes in _sass/color_schemes, derived from the app's tokens.
# The theme toggle (assets/js/dark-mode-service.js) switches to trufos-dark.
color_scheme: trufos-light

defaults:
  - scope:
      path: "" # an empty string here means all files in the project
      type: "pages"
    values:
      layout: "default"
      image:
        path: "/assets/images/social-preview.png"
        width: 1200
        height: 630
        alt: "Trufos showing a POST request with variables in its JSON body and the response next to it"

exclude:
  # from https://github.com/jekyll/jekyll/blob/master/lib/site_template/_config.yml:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # specific to the theme website:
  - bin/
  - lib/
  - tools/
  - "*.gemspec"
  - "*.gem"
  - LICENSE.txt
  - package.json
  - package-lock.json
  - Rakefile
  - README.md
  - CODE_OF_CONDUCT.md
  - AGENTS.md
  - documentation/LICENSE.md
  - docker-compose.yml
  - Dockerfile
  # theme test code
  - fixtures/

sass:
  quiet_deps: true # https://github.com/just-the-docs/just-the-docs/issues/1541
  silence_deprecations: [ 'import' ] # https://github.com/just-the-docs/just-the-docs/issues/1607