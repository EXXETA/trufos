<!--
  Dark theme before first paint: write the dark stylesheet as a render-blocking <link>, so the
  browser never paints between the light and the dark sheet. assets/js/dark-mode-service.js
  removes it once the theme's own stylesheet has switched to dark and loaded.
  The light theme needs nothing here: just-the-docs-default.css is trufos-light (_config.yml).
-->
<script>
  (function () {
    var theme = null;
    try {
      theme = localStorage.getItem("theme");
    } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    if (theme === "dark") {
      document.write('<link rel="stylesheet" id="trufos-theme-boot" href="{{ '/assets/css/just-the-docs-trufos-dark.css' | relative_url }}">');
    }
  })();
</script>
