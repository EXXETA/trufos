name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build_and_test:
    if: ${{ !github.event.pull_request.draft }}
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Prettier check
        run: yarn run prettier-check

      - name: Type check
        run: yarn run typecheck

      - name: Run tests
        run: yarn test

      - name: Check if dependencies changed
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            dependencies:
              - 'yarn.lock'

      - name: Build package
        if: ${{ steps.changes.outputs.dependencies == 'true' }}
        run: yarn run package

  e2e:
    if: ${{ !github.event.pull_request.draft }}
    name: UI/UX End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Produces the `.vite` production bundles the suite runs. Forge has no standalone build
      # command, so packaging is the way to get them.
      - name: Build application bundles
        run: yarn run package

      # The suite launches the Electron binary from node_modules, which is put there by electron's
      # postinstall rather than by the package download itself. This is a no-op when it is already
      # present, and `yarn install --immutable` does not reliably leave it behind on a cold runner.
      - name: Ensure the Electron binary is installed
        run: node node_modules/electron/install.js

      # Electron needs a display server even though nobody is watching, and a session bus: without
      # one, `safeStorage` talks to a secret service that is not there.
      - name: Run end-to-end tests
        env:
          # Chromium's browser process currently never announces its DevTools endpoint on this
          # runner, and Playwright truncates the process output it quotes in a timeout. These make
          # Playwright echo every line the app writes, and Chromium report its own startup.
          DEBUG: pw:browser
          ELECTRON_ENABLE_LOGGING: '1'
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24"
          dbus-run-session -- yarn run e2e --retries=0

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: e2e-diagnostics
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
